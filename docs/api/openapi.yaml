        '403': &id004
          description: Wrong role (a doctor who is not active gets 403 with status)
        '404': &id005
          description: Not found
        '422': &id006
          description: Validation error
      description: weekly = last 7 days, monthly = last 30 days (today included),
        previous_month = the 30 days before. Days without data have average = null.
