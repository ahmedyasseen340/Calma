  /api/auth/forgot-password:
    post:
      tags:
      - Auth
      summary: 'Forgot password, screen 1: email the 6-digit code'
      security: []
      description: Always answers 200 with the same message, whether or not the email
        exists. The code is valid for 15 minutes. Rate limited to 5 per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
            example:
              email: a@a.com
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Invalid email format
  /api/auth/verify-reset-code:
    post:
      tags:
      - Auth
      summary: 'Forgot password, screen 2: confirm the code'
      security: []
      description: 'Checks the code only (it is NOT used up; screen 3 sends it again).
        One message for every failure (unknown email, wrong, expired or cancelled
        code): ''الإيميل أو الكود غير صحيح.''. 5 wrong guesses cancel the code. Rate
        limited to 10 per minute.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^[0-9]{6}$
              required:
              - email
              - code
            example:
              email: a@a.com
              code: '123456'
      responses:
        '200':
          description: The code is right
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  valid:
                    type: boolean
        '422':
          description: Validation error
  /api/auth/reset-password:
    post:
      tags:
      - Auth
      summary: 'Forgot password, screen 3: set the new password'
      security: []
      description: Send the email and the code from screen 2 with the two password
        fields. If the two passwords differ the answer is 422 on 'password' ('كلمة
        المرور الجديدة وتأكيدها لازم يكونوا متطابقين.') and the code stays valid.
        On success the code is used up and all old login tokens are revoked; the app
        then opens the login screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
              required:
              - email
              - code
              - password
              - password_confirmation
            example:
              email: a@a.com
              code: '123456'
              password: new-password-123
              password_confirmation: new-password-123
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Wrong or expired code, or weak / unconfirmed password
  /api/patient/chat/voice:
    post:
      tags:
      - Patient
      summary: Send a voice message (tone-of-voice analysis)
      security:
      - bearerAuth: []
      description: The recording is forwarded to the AI service for speech-to-text
        and emotion detection. It is saved on the private disk even if the AI is down
        (ai_available=false, emotion=null). Rate limited to 10 per minute.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: mp3/wav/m4a/aac/ogg/webm/3gp/amr, max 10 MB
              required:
              - audio
      responses:
        '201':
          description: Saved with the bot's reply and the detected emotion
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat:
                    $ref: '#/components/schemas/ChatMessage'
                  ai_available:
                    type: boolean
        '401':
          description: Unauthenticated
        '403':
          description: Not a patient
        '422':
          description: Validation error
  /api/patient/chat/{message}/audio:
