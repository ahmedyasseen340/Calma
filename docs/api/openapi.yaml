          description: Validation error
  /api/doctor/profile:
    post:
      tags:
      - Doctor
      summary: Edit my own data (doctor)
      security:
      - bearerAuth: []
      description: 'Send only the fields you want to change (multipart/form-data when
        sending a photo). Editable: first_name, last_name, phone, clinic_url, bio
        (max 300), photo, specialization. Changing the specialization puts the account
        back to pending: the doctor is logged out until an admin approves again (requires_approval=true).
        Any other change stays active. Email, date of birth, ID card, certificate
        and status cannot be changed.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                  pattern: ^\+?[0-9]{8,15}$
                clinic_url:
                  type: string
                  format: uri
                  nullable: true
                  description: Send empty to clear
                bio:
                  type: string
                  maxLength: 300
                  nullable: true
                photo:
                  type: string
                  format: binary
                specialization:
                  type: string
                  description: Changing it needs admin re-approval
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  requires_approval:
                    type: boolean
                    description: true when the specialization changed and the account
                      is pending again
        '401':
          description: Unauthenticated
        '403':
          description: Wrong role
        '422':
          description: Validation error
  /api/auth/doctor/resubmit:
    post:
      tags:
      - Auth
      summary: 'Rejected doctor: register the data again'
      security: []
      description: For a doctor whose registration was rejected (login answered 403
        with status=rejected, can_resubmit=true). The doctor proves who they are with
        the email and password they registered with. All registration data is required
        again. On success the profile is pending again and the old files are deleted.
        Others get 403. Rate limited to 5 per minute.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                dob:
                  type: string
                  format: date
                specialization:
                  type: string
                phone:
                  type: string
                  pattern: ^\+?[0-9]{8,15}$
                clinic_url:
                  type: string
                  format: uri
                bio:
                  type: string
                  maxLength: 300
                photo:
                  type: string
                  format: binary
                id_card_img:
                  type: string
                  format: binary
                certificate_img:
                  type: string
                  format: binary
              required:
              - email
              - password
              - first_name
              - last_name
              - dob
              - specialization
              - phone
              - photo
              - id_card_img
              - certificate_img
      responses:
        '200':
          description: Sent for a new review
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
        '403':
          description: Not a rejected doctor
        '422':
          description: Validation error
