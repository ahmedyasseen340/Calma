      security: &id002
      - bearerAuth: []
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  weekly:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      average:
                        type: number
                        nullable: true
                      entries:
                        type: integer
                      days:
                        type: array
                        items: &id001
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            average:
                              type: number
                              nullable: true
                            entries:
                              type: integer
                            moving_average:
                              type: number
                              nullable: true
                              description: average of the last 3 days with data
                        description: 7 rows, one per day
                  monthly:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      average:
                        type: number
                        nullable: true
                      entries:
                        type: integer
                      days:
                        type: array
                        items: *id001
                        description: 30 rows, one per day
                  previous_month:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      average:
                        type: number
                        nullable: true
                      entries:
                        type: integer
                  comparison:
                    type: object
                    properties:
                      difference:
                        type: number
                        nullable: true
                      trend:
                        type: string
                        nullable: true
                        enum:
